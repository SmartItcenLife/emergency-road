<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임산부 병원 목록</title>

    <style>
        body {
            margin: 0;
            background: #fdfafb;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background: #fffafa;
            padding: 14px;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .page {
                max-width: 430px;
                margin: 0 auto;
            }
        }

        .header {
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .location {
            font-size: 13px;
            color: #db2777;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin: 18px 0 10px;
        }

        .sort-form {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin: 0 0 12px;
        }

        .sort-label {
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
        }

        .sort-select {
            height: 32px;
            padding: 0 28px 0 10px;
            border: 1px solid #f9a8d4;
            border-radius: 6px;
            background: #ffffff;
            color: #374151;
            font-size: 12px;
            font-weight: 700;
        }

        .hospital-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hospital-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid #fce7f3;
            border-radius: 8px;
        }

        .hospital-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .hospital-icon {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #fdf2f8;
            color: #db2777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex: 0 0 auto;
        }

        .hospital-info {
            min-width: 0;
            flex: 1;
            padding-right: 4px;
        }

        .hospital-name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            color: #111827;
            display: block;
            word-break: keep-all;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .hospital-meta {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            flex-wrap: wrap;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-free {
            background: #dcfce7;
            color: #16a34a;
        }

        .badge-normal {
            background: #fef9c3;
            color: #ca8a04;
        }

        .badge-busy {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-unknown {
            background: #f3f4f6;
            color: #6b7280;
        }

        .hospital-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .hospital-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .donut {
            --rate: 0;
            --donut-color: #f472b6;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(var(--donut-color) calc(var(--rate) * 1%), #fce7f3 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .donut-free {
            --donut-color: #22c55e;
        }

        .donut-normal {
            --donut-color: #facc15;
        }

        .donut-busy {
            --donut-color: #ef4444;
        }

        .donut-unknown {
            --donut-color: #9ca3af;
        }

        .donut::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ffffff;
        }

        .donut span {
            position: relative;
            font-size: 11px;
            font-weight: 800;
            color: #db2777;
        }

        .bed-text {
            font-size: 10px;
            color: #9ca3af;
            text-align: center;
            white-space: nowrap;
        }

        .hospital-actions {
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .call-button,
        .route-button,
        .community-button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff1f2;
            color: #db2777;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid #fecdd3;
            flex: 0 0 auto;
        }

        .icon-img {
            width: 14px;
            height: 14px;
        }

        .call-button-disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .detail-toggle {
            width: 20px;
            height: 70px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex: 0 0 auto;
        }

        .detail-toggle-icon {
            width: 8px;
            height: 14px;
            opacity: 0.55;
            transition: transform 0.2s ease;
        }

        .detail-toggle-open .detail-toggle-icon {
            transform: rotate(90deg);
            opacity: 1;
        }

        .hospital-detail-wrapper {
            margin-top: -4px;
            margin-bottom: 10px;
        }

        .hospital-detail-panel {
            padding: 12px;
            background: #ffffff;
            border: 1px solid #fce7f3;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .detail-section + .detail-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #fff1f2;
        }

        .detail-title {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 800;
            color: #db2777;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
        }

        .detail-label {
            color: #9ca3af;
            flex: 0 0 auto;
        }

        .detail-value {
            font-weight: 700;
            color: #1f2937;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .detail-resource-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .detail-resource {
            padding: 10px;
            border: 1px solid #fce7f3;
            border-radius: 8px;
            background: #fffafa;
        }

        .detail-resource-name {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            color: #6b7280;
        }

        .detail-resource-value {
            font-size: 13px;
            font-weight: 800;
            color: #111827;
        }

        .detail-capability-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .detail-capability {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }

        .capability-badge {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            flex: 0 0 auto;
        }

        .capability-available {
            background: #dcfce7;
            color: #16a34a;
        }

        .capability-unavailable {
            background: #fee2e2;
            color: #dc2626;
        }

        .capability-unknown {
            background: #e5e7eb;
            color: #6b7280;
        }

        .detail-loading,
        .detail-error {
            padding: 15px;
            font-size: 12px;
            color: #db2777;
            text-align: center;
            font-weight: 600;
        }

        .detail-error {
            color: #dc2626;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #6b7280;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>

<body>
<div class="page">
    <header class="header">
        <h1 class="title">임산부 병원 목록</h1>
        <div class="location">
            <span th:text="${locationProvided ? '현재 위치' : '기본 위치'}">현재 위치</span>
            :
            <span th:text="${displayLocation}"></span>
        </div>
    </header>

    <section>
        <h2 class="section-title">전체 병원 목록</h2>

        <form class="sort-form" th:action="@{/pregnant/hospitals}" method="get">
            <input type="hidden" name="lat" th:value="${userLat}">
            <input type="hidden" name="lon" th:value="${userLon}">

            <label class="sort-label" for="sort">정렬</label>
            <select id="sort" name="sort" class="sort-select" onchange="this.form.submit()">
                <option value="SCORE" th:selected="${sort == 'SCORE'}">점수순</option>
                <option value="DISTANCE" th:selected="${sort == 'DISTANCE'}">거리순</option>
                <option value="BED" th:selected="${sort == 'BED'}">병상여유순</option>
            </select>
        </form>

        <div class="empty" th:if="${#lists.isEmpty(hospitals)}">
            표시할 병원 정보가 없습니다.
        </div>

        <div class="hospital-list" th:unless="${#lists.isEmpty(hospitals)}">
            <article class="hospital-card" th:each="hospital : ${hospitals}">
                <div class="hospital-left">
                    <div class="hospital-icon">P</div>

                    <div class="hospital-info">
                        <div class="hospital-name" th:text="${hospital.hospitalName}">
                            병원명
                        </div>

                        <div class="hospital-meta">
                            <span th:text="${hospital.distanceKm != null ? #numbers.formatDecimal(hospital.distanceKm, 1, 1) + 'km' : '-'}">
                                2.6km
                            </span>

                            <span class="badge"
                                  th:classappend="${hospital.deliveryAvailableLabel == '가능'} ? ' badge-free' :
                                                  (${hospital.deliveryAvailableLabel == '불가'} ? ' badge-busy' : ' badge-unknown')"
                                  th:text="${hospital.deliveryAvailableLabel}">
                                분만 가능
                            </span>

                            <span class="badge"
                                  th:classappend="${hospital.deliveryRoomAvailableLabel == '가능'} ? ' badge-free' :
                                                  (${hospital.deliveryRoomAvailableLabel == '불가'} ? ' badge-busy' : ' badge-unknown')"
                                  th:text="|분만실 ${hospital.deliveryRoomAvailableLabel}|">
                                분만실 가능
                            </span>
                        </div>
                    </div>
                </div>

                <div class="hospital-right">
                    <div class="hospital-status">
                        <div class="donut"
                             th:classappend="${hospital.nicuCongestionLabel == '여유'} ? ' donut-free' :
                                            (${hospital.nicuCongestionLabel == '보통'} ? ' donut-normal' :
                                            (${hospital.nicuCongestionLabel == '혼잡'} ? ' donut-busy' : ' donut-unknown'))"
                             th:style="|--rate: ${hospital.nicuAvailablePercentage != null ? hospital.nicuAvailablePercentage : 0}|">
                            <span th:text="${hospital.nicuAvailablePercentage != null ? hospital.nicuAvailablePercentage + '%' : '-'}">
                                50%
                            </span>
                        </div>

                        <div class="bed-text">
                            <div th:text="|NICU ${hospital.nicuBedCount != null ? hospital.nicuBedCount : 0} / ${hospital.nicuStandard != null ? hospital.nicuStandard : 0}|">
                                NICU 0 / 0
                            </div>
                        </div>

                        <div class="hospital-actions">
                            <a class="call-button"
                               th:href="${hospital.emergencyPhone != null ? 'tel:' + hospital.emergencyPhone : '#'}"
                               th:classappend="${hospital.emergencyPhone == null} ? ' call-button-disabled'">
                                <img th:src="@{/images/phone.svg}" class="icon-img" alt="전화">
                            </a>

                            <a class="route-button"
                               href="#"
                               th:data-hospital-name="${hospital.hospitalName}"
                               th:data-lat="${hospital.hospitalLatitude}"
                               th:data-lon="${hospital.hospitalLongitude}">
                                <img th:src="@{/images/finder.svg}" class="icon-img" alt="길찾기">
                            </a>

                            <a class="community-button" th:href="@{/community(hpid=${hospital.hpid})}">
                                <img th:src="@{/images/community.svg}" class="icon-img" alt="커뮤니티">
                            </a>
                        </div>
                    </div>

                    <button type="button"
                            class="detail-toggle"
                            th:data-hpid="${hospital.hpid}"
                            aria-label="상세보기">
                        <img th:src="@{/images/angle-brackets.png}" class="detail-toggle-icon" alt="상세보기">
                    </button>
                </div>
            </article>
        </div>
    </section>
</div>

<script th:inline="javascript">
    const locationProvided = [[${locationProvided}]];

    if (!locationProvided && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const currentSort = [[${sort}]];

                window.location.href = `/pregnant/hospitals?lat=${lat}&lon=${lon}&sort=${currentSort}`;
            },
            function() {
                console.log("위치 정보 제공이 거부되었습니다.");
            }
        );
    }

    const userLat = [[${userLat}]];
    const userLon = [[${userLon}]];

    document.querySelectorAll(".route-button").forEach(function(button) {
        button.addEventListener("click", function(e) {
            e.preventDefault();

            const hospitalName = button.dataset.hospitalName;
            const hospitalLat = button.dataset.lat;
            const hospitalLon = button.dataset.lon;

            if (!hospitalLat || !hospitalLon) {
                alert("병원 위치 정보가 없습니다");
                return;
            }

            const startName = encodeURIComponent("현재 위치");
            const endName = encodeURIComponent(hospitalName);
            const url = `https://map.kakao.com/link/by/car/${startName},${userLat},${userLon}/${endName},${hospitalLat},${hospitalLon}`;

            window.open(url, "_blank");
        });
    });

    document.querySelectorAll(".detail-toggle").forEach(function(button) {
        button.addEventListener("click", function() {
            const hpid = button.dataset.hpid;
            const card = button.closest(".hospital-card");
            const currentDetail = card.nextElementSibling;

            if (currentDetail && currentDetail.classList.contains("hospital-detail-wrapper")) {
                currentDetail.remove();
                button.classList.remove("detail-toggle-open");
                return;
            }

            document.querySelectorAll(".hospital-detail-wrapper").forEach(function(detail) {
                detail.remove();
            });
            document.querySelectorAll(".detail-toggle-open").forEach(function(openButton) {
                openButton.classList.remove("detail-toggle-open");
            });

            button.classList.add("detail-toggle-open");

            const loadingWrapper = document.createElement("div");
            loadingWrapper.className = "hospital-detail-wrapper";
            loadingWrapper.innerHTML = `<div class="detail-loading">상세 정보를 불러오는 중입니다.</div>`;
            card.insertAdjacentElement("afterend", loadingWrapper);

            fetch(`/pregnant/hospitals/${hpid}/detail`)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("상세 정보를 불러오지 못했습니다.");
                    }
                    return response.json();
                })
                .then(function(detail) {
                    loadingWrapper.innerHTML = createPregnantDetailHtml(detail);
                })
                .catch(function(error) {
                    loadingWrapper.innerHTML = `<div class="detail-error">${escapeHtml(error.message)}</div>`;
                });
        });
    });

    function createPregnantDetailHtml(detail) {
        return `
            <div class="hospital-detail-panel">
                <div class="detail-section">
                    <h3 class="detail-title">기본 정보</h3>
                    ${createDetailRow("주소", detail.address)}
                    ${createDetailRow("응급실 번호", detail.emergencyPhone)}
                    ${createDetailRow("대표전화", detail.phone)}
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">실시간 임산부 자원</h3>
                    <div class="detail-resource-grid">
                        ${createResourceItem("NICU 병상", detail.nicuBedCount, detail.nicuStandard)}
                        ${createResourceItem("분만실 기준", detail.deliveryRoomStandard)}
                        ${createResourceItem("인공호흡기 기준", detail.ventilatorStandard)}
                        ${createResourceItem("인큐베이터 기준", detail.incubatorStandard)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">진료 가능 여부</h3>
                    <div class="detail-capability-list">
                        ${createCapabilityItem("분만실 사용 가능", detail.isDeliveryRoomAvailable)}
                        ${createCapabilityItem("인큐베이터 사용 가능", detail.incubatorAvailable)}
                        ${createCapabilityItem("조산아 인공호흡기 사용 가능", detail.prematureVentilatorAvailable)}
                        ${createCapabilityItem("NICU 치료", detail.nicuAvailable)}
                        ${createCapabilityItem("응급 분만", detail.deliveryAvailable)}
                        ${createCapabilityItem("산과 수술", detail.obstetricSurgeryAvailable)}
                        ${createCapabilityItem("부인과 수술", detail.gynecologySurgeryAvailable)}
                        ${createCapabilityItem("응급 투석", detail.emergencyDialysisAvailable)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">갱신 시간</h3>
                    ${createDetailRow("실시간 정보", formatDateTime(detail.realtimeRecordedAt))}
                </div>
            </div>
        `;
    }

    function createDetailRow(label, value) {
        return `
            <div class="detail-row">
                <span class="detail-label">${escapeHtml(label)}</span>
                <span class="detail-value">${escapeHtml(displayValue(value))}</span>
            </div>
        `;
    }

    function createResourceItem(label, current, standard) {
        return `
            <div class="detail-resource">
                <span class="detail-resource-name">${escapeHtml(label)}</span>
                <span class="detail-resource-value">${escapeHtml(formatCount(current, standard))}</span>
            </div>
        `;
    }

    function createCapabilityItem(label, value) {
        const status = normalizeAvailability(value);

        return `
            <div class="detail-capability">
                <span>${escapeHtml(label)}</span>
                <span class="capability-badge ${status.className}">${escapeHtml(status.label)}</span>
            </div>
        `;
    }

    function normalizeAvailability(value) {
        if (value === true) {
            return { label: "가능", className: "capability-available" };
        }

        if (value === false) {
            return { label: "불가", className: "capability-unavailable" };
        }

        const v = String(displayValue(value)).trim().toUpperCase();

        if (v === "Y" || v === "Y1" || v === "YES" || v === "TRUE" || v === "1" || v === "가능") {
            return { label: "가능", className: "capability-available" };
        }

        if (v === "N" || v === "N1" || v === "NO" || v === "FALSE" || v === "0" || v === "불가") {
            return { label: "불가", className: "capability-unavailable" };
        }

        return { label: displayValue(value), className: "capability-unknown" };
    }

    function formatCount(current, standard) {
        const currentValue = displayValue(current);
        const standardValue = displayValue(standard);

        if (standardValue === "-") {
            return currentValue;
        }

        return `${currentValue} / ${standardValue}`;
    }

    function formatDateTime(value) {
        return value ? value.replace("T", " ").slice(0, 16) : "-";
    }

    function displayValue(value) {
        if (value === null || value === undefined || value === "") {
            return "-";
        }

        return value;
    }

    function escapeHtml(value) {
        return String(displayValue(value))
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
