<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소아 응급 추천 결과</title>

    <style>
        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
        }

        body {
            margin: 0;
            background: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #111827;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            padding: 14px;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .page {
                max-width: 430px;
                margin: 0 auto;
            }
        }

        .header {
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .location {
            font-size: 13px;
            color: #2563eb;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin: 18px 0 10px;
        }

        .hospital-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hospital-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* 상단 정렬 */
            padding: 20px;
            background: #ffffff;
            border-radius: 20px; /* 더 둥글게 */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04); /* 부드러운 그림자 */
            border: 1px solid blue;
            transition: transform 0.2s;
        }
        /* TOP 1 카드 강조 (배경색 추가) */
        .hospital-card.top1 {
            background: #f8fafc;
            border: 1px solid #dbeafe;
        }

        .hospital-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .hospital-icon {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #e0f2fe;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex: 0 0 auto;
        }

        .hospital-info {
            font-size: 14px;
            color: #64748b;
            /*display: flex;*/
            gap: 8px;
        }

        .hospital-name {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .hospital-meta {
            margin-top: 5px;
            font-size: 13px;
            color: #6b7280;
            display: block; /* 나란히 배치되지 않도록 block으로 변경 */
        }

        .badge {
            padding: 4px 7px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        .badge-free {
            background: #dcfce7;
            color: #16a34a;
        }

        .badge-normal {
            background: #fef3c7;
            color: #d97706;
        }

        .badge-busy {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-unknown {
            background: #e5e7eb;
            color: #6b7280;
        }

        .hospital-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .call-button,
        .route-button,
        .community-button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f1f5f9;      /* 기본 배경: 회색 */
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid #e2e8f0; /* 기본 테두리: 회색 */
            flex: 0 0 auto;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .call-button:hover,
        .route-button:hover,
        .community-button:hover{
            background: #eff6ff; /* 연한 파란색 배경 */
            border-color: #bfdbfe; /* 파란 테두리 */
            color: #2563eb;       /* 파란 아이콘 색상 */
        }

        .call-icon-img,
        .finder-icon-img,
        .community-icon-img {
            width: 14px;
            height: 14px;
        }

        .detail-toggle {
            width: 20px;
            height: 70px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex: 0 0 auto;
        }

        .detail-toggle-icon {
            width: 8px;
            height: 14px;
            display: block;
            opacity: 0.55;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .detail-toggle:hover .detail-toggle-icon {
            opacity: 1;
        }

        .call-button-disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .hospital-actions {
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .hospital-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .donut {
            --rate: 0;
            --donut-color: #9ca3af;

            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(var(--donut-color) calc(var(--rate) * 1%), #e5e7eb 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .donut-free {
            --donut-color: #22c55e;
        }

        .donut-normal {
            --donut-color: #facc15;
        }

        .donut-busy {
            --donut-color: #ef4444;
        }

        .donut-unknown {
            --donut-color: #9ca3af;
        }

        .donut::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ffffff;
        }

        .donut span {
            position: relative;
            font-size: 11px;
            font-weight: 800;
            color: var(--donut-color);
        }

        .bed-text {
            font-size: 10px;
            color: #6b7280;
            text-align: center;
            white-space: nowrap;
        }

        .detail-toggle-open .detail-toggle-icon {
            transform: rotate(90deg);
            opacity: 1;
        }

        .hospital-detail-wrapper {
            margin-top: -4px;
            margin-bottom: 10px;
        }

        .hospital-detail-panel {
            padding: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .detail-section + .detail-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eef2f7;
        }

        .detail-title {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 800;
            color: #111827;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
            font-size: 12px;
            color: #4b5563;
        }

        .detail-label {
            flex: 0 0 auto;
            color: #6b7280;
        }

        .detail-value {
            min-width: 0;
            text-align: right;
            font-weight: 700;
            color: #1f2937;
            word-break: keep-all;
        }

        .detail-loading,
        .detail-error {
            padding: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
        }

        .detail-error {
            color: #dc2626;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #6b7280;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .detail-resource-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .detail-resource {
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }

        .detail-resource-name {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            color: #6b7280;
        }

        .detail-resource-value {
            font-size: 13px;
            font-weight: 800;
            color: #111827;
        }

        .detail-capability-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .detail-capability {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }

        .capability-badge {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .capability-available {
            background: #dcfce7;
            color: #16a34a;
        }

        .capability-unavailable {
            background: #fee2e2;
            color: #dc2626;
        }

        .capability-unknown {
            background: #e5e7eb;
            color: #6b7280;
        }

        .detail-message {
            margin-top: 4px;
            font-size: 11px;
            color: #6b7280;
        }
        .tag-wrapper {
            margin-top: 8px;

            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag-badge {
            background: #eff6ff; /* 더 진한 파란색 톤 */
            color: #1e40af;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px; /* 둥근 사각형 */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="page">

    <header class="header">
        <h1 class="title">소아 응급 추천 결과</h1>

        <div class="location">
            <span th:text="${locationProvided ? '현재 위치' : '기본 위치'}">현재 위치</span>
            :
            <span th:text="${displayLocation}"></span>
        </div>
    </header>

    <section>

        <div style="margin: 18px 0 10px;">
            <h2 class="section-title" style="margin-bottom: 4px;">추천 병원 TOP 3</h2>
            <p style="font-size: 13px; color: #64748b; margin: 0;">
                현재 위치로부터 10km 이내,<br/>
                <span style="color: #2563eb; font-weight: 700;">진료 가능 여부와 실시간 상황</span>을 종합 분석한 추천 결과입니다.
            </p>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(rankings)}">
            10km 반경 내에 추천 가능한 병원이 없습니다.<br>
            아래 버튼을 눌러 전체 병원 목록을 확인해보세요.
        </div>

        <div class="hospital-list" th:unless="${#lists.isEmpty(rankings)}">

            <article class="hospital-card"
                     th:each="hospital, iter : ${rankings}"
                     th:style="${iter.index == 0} ?
                     'border:2px solid #2563eb;background:#eff6ff;' : ''">

                <div class="hospital-left">

                    <div class="hospital-icon">H</div>

                    <div class="hospital-info">

                        <div style="margin-bottom:20px; margin-top:20px;">
                            <span class="badge"
                                  style="background:#2563eb;color:white;"
                                  th:text="|TOP ${iter.index + 1}|">
                                TOP1
                            </span>
                        </div>

                        <div class="hospital-name"
                             th:text="${hospital.hospitalName}">
                            한양대병원
                        </div>

                        <div class="hospital-meta">

                           <span th:text="${hospital.distance != null ?
                                    #numbers.formatDecimal(hospital.distance, 1, 1) + 'km' : '-'}">  </span>

                            <span>•</span>

                            <span th:text="${hospital.duration != null ? T(java.lang.Math).round(hospital.duration) + '분' : '-'}">  </span>
                            <span class="badge"
                                  th:classappend="${hospital.congestionLabel == '여유'} ? ' badge-free' :
                                                  (${hospital.congestionLabel == '보통'} ? ' badge-normal' :
                                                  (${hospital.congestionLabel == '혼잡'} ? ' badge-busy' : ' badge-unknown'))"
                                  th:text="${hospital.congestionLabel}">
                                보통
                            </span>

                        </div>

                        <div class="tag-wrapper"
                             th:if="${hospital.tags != null}">

                            <small th:each="tag : ${#strings.arraySplit(hospital.tags, '|')}"
                                   class="tag-badge"
                                   th:text="${tag}">
                            </small>

                        </div>

                    </div>
                </div>

                <div class="hospital-right" style="display: flex; align-items: center; gap: 8px;">

                    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">

                        <div class="donut-container" style="width: 80px; height: 80px; position: relative;">
                            <canvas th:id="'chart-' + ${hospital.hpid}"></canvas>
                        </div>

                        <div class="bed-text" style="line-height: 1.2;">
                            <div style="font-size: 15px; color: #64748b;" th:text="'전체 ' + (${hospital.totalPediatricBedCount} ?: 0) + '병상'">전체 0병상</div>
                        </div>

                        <div th:if="${hospital.congestionLabel == '주의'}"
                             style="font-size: 10px; color: #f97316; font-weight: bold;">
                            전화 확인 필수!
                        </div>

                        <div class="hospital-actions" style="display: flex; flex-direction: row; gap: 6px; margin-top: 4px;">
                            <a class="call-button" th:href="${hospital.emergencyPhone != null ? 'tel:' + hospital.emergencyPhone : '#'}" th:classappend="${hospital.emergencyPhone == null} ? ' call-button-disabled'">
                                <img th:src="@{/images/phone.svg}" class="call-icon-img" alt="전화">
                            </a>
                            <a class="route-button" href="#" th:data-hospital-name="${hospital.hospitalName}" th:data-lat="${hospital.hospitalLatitude}" th:data-lon="${hospital.hospitalLongitude}">
                                <img th:src="@{/images/finder.svg}" class="finder-icon-img" alt="길찾기">
                            </a>
                            <a class="community-button" th:href="@{/community(hpid=${hospital.hpid})}">
                                <img th:src="@{/images/community.svg}" class="community-icon-img" alt="커뮤니티">
                            </a>
                        </div>
                    </div>

                    <button type="button" class="detail-toggle" th:data-hpid="${hospital.hpid}" aria-label="상세보기">
                        <img th:src="@{/images/angle-brackets.png}" class="detail-toggle-icon" alt="더보기">
                    </button>
                </div>

            </article>
            <div style="text-align: center; margin: 24px 0 40px; padding: 20px; background: #f8fafc; border-radius: 16px;">
                <p style="font-size: 14px; color: #64748b; margin-bottom: 12px;">
                    원하는 병원을 찾지 못하셨나요?<br>
                    더 넓은 범위의 병원 정보를 확인해보세요.
                </p>
                <a href="/pediatric/hospitals"
                   style="display: inline-block; padding: 12px 24px; background: #2563eb; color: #ffffff;
              text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 14px;">
                    전체 병원 보기
                </a>
            </div>
        </div>


    </section>

</div>

<script th:inline="javascript">

    const userLat = [[${userLat}]];
    const userLon = [[${userLon}]];

    document.querySelectorAll(".route-button").forEach(function (button) {

        button.addEventListener("click", function (e) {

            e.preventDefault();

            const hospitalName = button.dataset.hospitalName;
            const hospitalLat = button.dataset.lat;
            const hospitalLon = button.dataset.lon;

            if (!hospitalLat || !hospitalLon) {
                alert("병원 위치 정보가 없습니다");
                return;
            }

            const startName = encodeURIComponent("현재 위치");
            const endName = encodeURIComponent(hospitalName);

            const url =
                `https://map.kakao.com/link/by/car/${startName},${userLat},${userLon}/${endName},${hospitalLat},${hospitalLon}`;

            window.open(url, "_blank");
        });
    });
    document.querySelectorAll(".detail-toggle").forEach(function(button) {
        button.addEventListener("click", function() {
            const hpid = button.dataset.hpid;
            const card = button.closest(".hospital-card");
            const currentDetail = card.nextElementSibling;

            if (currentDetail && currentDetail.classList.contains("hospital-detail-wrapper")) {
                currentDetail.remove();
                button.classList.remove("detail-toggle-open");
                return;
            }

            document.querySelectorAll(".hospital-detail-wrapper").forEach(function(detail) {
                detail.remove();
            });
            document.querySelectorAll(".detail-toggle-open").forEach(function(openButton) {
                openButton.classList.remove("detail-toggle-open");
            });

            button.classList.add("detail-toggle-open");

            const loadingWrapper = document.createElement("div");
            loadingWrapper.className = "hospital-detail-wrapper";
            loadingWrapper.innerHTML = `<div class="detail-loading">상세 정보를 불러오는 중입니다.</div>`;
            card.insertAdjacentElement("afterend", loadingWrapper);

            fetch(`/pediatric/hospitals/${hpid}/detail`)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("상세 정보를 불러오지 못했습니다.");
                    }
                    return response.json();
                })
                .then(function(detail) {
                    loadingWrapper.innerHTML = createHospitalDetailHtml(detail);
                })
                .catch(function(error) {
                    loadingWrapper.innerHTML = `<div class="detail-error">${escapeHtml(error.message)}</div>`;
                });
        });
    });

    function createHospitalDetailHtml(detail) {
        return `
            <div class="hospital-detail-panel">
                <div class="detail-section">
                    <h3 class="detail-title">기본 정보</h3>
                    ${createDetailRow("주소", detail.address)}
                    ${createDetailRow("응급실 번호", detail.emergencyPhone)}
                    ${createDetailRow("대표전화", detail.phone)}
                    ${createDetailRow("소아 당직 연락처", detail.pediatricHotline)}
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">소아 핵심 자원</h3>
                    <div class="detail-resource-grid">
                        ${createResourceItem("소아 ICU", detail.pediatricIcuCount, detail.pediatricIcuStandard)}
                        ${createResourceItem("응급 소아 ICU", detail.pediatricEmergencyIcuCount, detail.pediatricEmergencyIcuStandard)}
                        ${createResourceItem("응급 소아 입원", detail.pediatricEmergencyAdmissionCount, detail.pediatricEmergencyAdmissionStandard)}
                        ${createResourceItem("소아 음압격리", detail.pediatricNegativeIsolationCount, detail.pediatricNegativeIsolationStandard)}
                        ${createResourceItem("소아 일반격리", detail.pediatricGeneralIsolationCount, detail.pediatricGeneralIsolationStandard)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">장비 가능 여부</h3>
                    <div class="detail-capability-list">
                        ${createCapabilityItem("소아 인공호흡기", detail.pediatricVentiAvailable)}
                        ${createCapabilityItem("조산아 인공호흡기", detail.preemieVentiAvailable)}
                        ${createCapabilityItem("인큐베이터", detail.incubatorAvailable)}
                        ${createCapabilityItem("인큐베이터 자원", detail.incubatorResourceAvailable)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">소아 중증 수용 가능</h3>
                    <div class="detail-capability-list">
                        ${createCapabilityItem("장중첩/폐색 영유아", detail.pediatricBowelObstructionAvailable, detail.pediatricBowelObstructionMessage)}
                        ${createCapabilityItem("응급내시경 위장관", detail.pediatricEmergencyEndoscopyGastroAvailable, detail.pediatricEmergencyEndoscopyGastroMessage)}
                        ${createCapabilityItem("응급내시경 기관지", detail.pediatricEmergencyEndoscopyBronchialAvailable, detail.pediatricEmergencyEndoscopyBronchialMessage)}
                        ${createCapabilityItem("저체중출생아", detail.lowBirthWeightInfantAvailable, detail.lowBirthWeightInfantMessage)}
                        ${createCapabilityItem("영상의학 혈관중재", detail.pediatricVascularInterventionAvailable, detail.pediatricVascularInterventionMessage)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">갱신 시간</h3>
                    ${createDetailRow("실시간 정보", formatDateTime(detail.realtimeRecordedAt))}
                    ${createDetailRow("기준 정보", formatDateTime(detail.standardRecordedAt))}
                </div>
            </div>
        `;
    }

    function createDetailRow(label, value) {
        return `
            <div class="detail-row">
                <span class="detail-label">${escapeHtml(label)}</span>
                <span class="detail-value">${escapeHtml(displayValue(value))}</span>
            </div>
        `;
    }

    // 자원 정보를 표시하는 작은 박스를 만드는 함수
    function createResourceItem(label, current, standard) {
        return `
            <div class="detail-resource">
                <span class="detail-resource-name">${escapeHtml(label)}</span>
                <span class="detail-resource-value">${escapeHtml(formatCount(current, standard))}</span>
            </div>
        `;
    }
    // 가능 여부를 표시하는 행을 만드는 함수
    function createCapabilityItem(label, value, message) {
        const status = normalizeAvailability(value);
        const messageHtml = message ? `<div class="detail-message">${escapeHtml(message)}</div>` : "";

        return `
            <div>
                <div class="detail-capability">
                    <span>${escapeHtml(label)}</span>
                    <span class="capability-badge ${status.className}">${escapeHtml(status.label)}</span>
                </div>
                ${messageHtml}
            </div>
        `;
    }

    function normalizeAvailability(value) {
        if (value === true || value === "Y" || value === "가능" || value === "1") {
            return { label: "가능", className: "capability-available" };
        }
        if (value === false || value === "N" || value === "불가" || value === "0") {
            return { label: "불가", className: "capability-unavailable" };
        }
        return { label: displayValue(value), className: "capability-unknown" };
    }
    // 현재 수 / 기준 수 출력 포맷 설정 함수
    function formatCount(current, standard) {
        const currentValue = displayValue(current);
        const standardValue = displayValue(standard);

        if (currentValue === "-" && standardValue === "-") {
            return "-";
        }
        return `${currentValue} / ${standardValue}`;
    }
    // 빈 문자열을 "-" 로 표기
    function displayValue(value) {
        if (value === null || value === undefined || value === "") {
            return "-";
        }
        return value;
    }

    function formatDateTime(value) {
        if (!value) {
            return "-";
        }
        return value.replace("T", " ").slice(0, 16);
    }
    // 문자열을 HTML 로 바로 넣을 때 발생하는 문제를 방지하기 위한 함수.
    function escapeHtml(value) {
        return String(displayValue(value))
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    const rankings = /*[[${rankings}]]*/ [];

    // 병원별로 차트 생성
    rankings.forEach(hospital => {
        const ctx = document.getElementById('chart-' + hospital.hpid).getContext('2d');
        const percentage = hospital.availableBedPercentage || 0;
        const available = hospital.availablePediatricBedCount || 0;

        // 혼잡도에 따른 색상 결정
        let color = '#9ca3af'; // unknown
        if (hospital.congestionLabel === '여유') color = '#22c55e';
        else if (hospital.congestionLabel === '보통') color = '#facc15';
        else if (hospital.congestionLabel === '혼잡' || hospital.congestionLabel === '주의') color = '#fb923c';

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [percentage, 100 - percentage],
                    backgroundColor: [color, '#f0f9ff'],
                    borderWidth: 0,
                    cutout: '70%' // 도넛 두께 조절
                }]
            },
            options: {
                plugins: { tooltip: { enabled: false } },
                responsive: true,
                maintainAspectRatio: false
            },
            plugins: [{
                id: 'centerText',
                beforeDraw: function(chart) {
                    const width = chart.width,
                        height = chart.height,
                        ctx = chart.ctx;

                    ctx.restore();
                    const fontSize = 18;
                     ctx.font = fontSize + "px 'Pretendard', sans-serif";
                    ctx.textBaseline = "middle";
                    ctx.textAlign = "center"; // 가로 중앙 정렬
                    ctx.fillStyle = color;

                    // "6개" 문자열 생성
                    const text = available.toString() + "개";

                    // 차트 정중앙에 배치
                    ctx.fillText(text, width / 2, height / 1.8);

                    ctx.save();
                }
            }]
        });
    });
</script>

</body>
</html>
