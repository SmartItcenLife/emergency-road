<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일반 응급 추천 결과</title>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            color: #1f2937;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background: #f8fafc;
            padding: 14px;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .page {
                max-width: 430px;
                margin: 0 auto;
            }
        }

        .header {
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .location {
            font-size: 13px;
            color: #16a34a;
        }
        .hospital-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .bed-text {
            font-size: 10px;
            color: #6b7280;
            text-align: center;
            white-space: nowrap;
        }

        .hospital-actions {
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin: 18px 0 10px;
        }

        .hospital-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hospital-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .hospital-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .hospital-icon {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .hospital-info {
            min-width: 0;
            flex: 1;
        }

        .hospital-name {
            font-size: 15px;
            font-weight: 700;
            word-break: keep-all;
        }

        .hospital-meta {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            flex-wrap: wrap;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-free { background: #dcfce7; color: #16a34a; }
        .badge-normal { background: #fef3c7; color: #d97706; }
        .badge-busy { background: #fee2e2; color: #dc2626; }
        .badge-unknown { background: #e5e7eb; color: #6b7280; }

        .hospital-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donut {
            --rate: 0;
            --donut-color: #9ca3af;

            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(var(--donut-color) calc(var(--rate) * 1%), #e5e7eb 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .donut::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ffffff;
        }

        .donut span {
            position: relative;
            font-size: 11px;
            font-weight: 800;
            color: var(--donut-color);
        }

        .donut-free { --donut-color: #22c55e; }
        .donut-normal { --donut-color: #facc15; }
        .donut-busy { --donut-color: #ef4444; }
        .donut-unknown { --donut-color: #9ca3af; }
        .hospital-actions a {
            margin: 0 3px;
            font-size: 12px;
            text-decoration: none;
        }
        .detail-toggle {
            width: 20px;
            height: 70px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .detail-toggle-icon {
            width: 8px;
            height: 14px;
            opacity: 0.55;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .detail-toggle-open .detail-toggle-icon {
            transform: rotate(90deg);
            opacity: 1;
        }

        .hospital-detail-wrapper {
            margin-top: -4px;
            margin-bottom: 10px;
        }

        .hospital-detail-panel {
            padding: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .detail-section + .detail-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eef2f7;
        }

        .detail-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 6px;
        }

        .detail-label {
            color: #6b7280;
        }

        .detail-value {
            font-weight: 700;
        }

        .detail-resource-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .detail-resource {
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }

        .detail-resource-name {
            font-size: 11px;
            color: #6b7280;
        }

        .detail-resource-value {
            font-size: 13px;
            font-weight: 800;
        }

        .detail-capability {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 6px;
        }

        .capability-badge {
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .call-icon-img,
        .finder-icon-img,
        .community-icon-img {
            width: 14px;
            height: 14px;
        }

        .call-button,
        .route-button,
        .community-button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid #bfdbfe;
        }
        .capability-available { background: #dcfce7; color: #16a34a; }
        .capability-unavailable { background: #fee2e2; color: #dc2626; }
        .capability-unknown { background: #e5e7eb; color: #6b7280; }
        .more-list-link {
            margin-top: 10px;
            text-align: center;
        }

        .more-link {
            display: inline-block;
            font-size: 12px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .more-link:hover {
            background: #dbeafe;
        }
    </style>
</head>

<body>
<div class="page">

    <div class="header">
        <h1 class="title">일반 응급 추천 결과</h1>
        <div class="location">
            <span th:text="${displayLocation}"></span>
        </div>
    </div>

    <h2 class="section-title">추천 병원 TOP</h2>

    <div class="hospital-list">

        <article class="hospital-card"
                 th:each="hospital, iter : ${rankings}">

            <!-- LEFT -->
            <div class="hospital-left">

                <div class="hospital-icon">H</div>

                <div class="hospital-info">

                    <span class="badge"
                          style="background:#16a34a;color:white;"
                          th:text="|TOP ${iter.index + 1}|">
                    </span>

                    <div class="hospital-name"
                         th:text="${hospital.hospitalName}">
                    </div>

                    <div class="hospital-meta">

                        <span th:text="${hospital.distance != null ? hospital.distance + 'km' : '-'}"></span>
                        <span>•</span>

                        <span th:text="${hospital.duration != null ? T(java.lang.Math).round(hospital.duration) + '분' : '-'}"></span>

                        <span class="badge"
                              th:classappend="${hospital.congestionLabel == '여유'} ? ' badge-free' :
                                              (${hospital.congestionLabel == '보통'} ? ' badge-normal' :
                                              (${hospital.congestionLabel == '혼잡'} ? ' badge-busy' : ' badge-unknown'))"
                              th:text="${hospital.congestionLabel}">
                        </span>

                    </div>

                    <div class="hospital-meta">
                        <span th:text="|가용 ${hospital.availableEmergencyBedCount} / ${hospital.totalEmergencyBedCount}|"></span>
                    </div>

                </div>
            </div>

            <!-- RIGHT (소아랑 동일 구조로 변경) -->
            <div class="hospital-right">

                <div class="hospital-status">

                    <div class="donut"
                         th:classappend="${hospital.congestionLabel == '여유'} ? ' donut-free' :
                                        (${hospital.congestionLabel == '보통'} ? ' donut-normal' :
                                        (${hospital.congestionLabel == '혼잡'} ? ' donut-busy' : ' donut-unknown'))"
                         th:style="|--rate:${hospital.availableBedPercentage != null ? hospital.availableBedPercentage : 0}|">

                        <span th:text="${#numbers.formatDecimal(hospital.availableBedPercentage, 0, 1)} + '%'"></span>

                    </div>

                    <div class="bed-text">
                        <div th:text="|가용 병상 ${hospital.availableEmergencyBedCount} / ${hospital.totalEmergencyBedCount}|"></div>
                    </div>

                    <!-- ACTIONS -->
                    <div class="hospital-actions">

                        <a class="call-button"
                           th:href="${hospital.emergencyPhone != null ? 'tel:' + hospital.emergencyPhone : '#'}"
                           th:classappend="${hospital.emergencyPhone == null} ? ' call-button-disabled'">

                            <img th:src="@{/images/phone.svg}"
                                 class="call-icon-img"
                                 alt="전화걸기">

                        </a>

                        <a class="route-button"
                           href="#"
                           th:data-hospital-name="${hospital.hospitalName}"
                           th:data-lat="${hospital.hospitalLatitude}"
                           th:data-lon="${hospital.hospitalLongitude}">

                            <img th:src="@{/images/finder.svg}"
                                 class="finder-icon-img"
                                 alt="길찾기">

                        </a>

                        <a class="community-button"
                           th:href="@{/community(hpid=${hospital.hpid})}"
                           aria-label="커뮤니티 이동">

                            <img th:src="@{/images/community.svg}"
                                 class="community-icon-img"
                                 alt="커뮤니티">

                        </a>

                    </div>
                </div>

                <!-- TOGGLE -->
                <button type="button"
                        class="detail-toggle"
                        th:data-hpid="${hospital.hpid}">
                    <img src="/images/angle-brackets.png"
                         class="detail-toggle-icon">
                </button>

            </div>

        </article>
        <div class="more-list-link">
            <a th:href="@{/general/hospitals}" class="more-link">
                👉 다른 병원도 보고 싶다면 전체 리스트 보기
            </a>
        </div>
    </div>

</div>

<script th:inline="javascript">

    document.querySelectorAll(".detail-toggle").forEach(function(button) {

        button.addEventListener("click", function() {

            const hpid = this.dataset.hpid;
            const card = this.closest(".hospital-card");

            // 기존 상세 제거
            const exist = card.nextElementSibling;
            if (exist && exist.classList.contains("hospital-detail-wrapper")) {
                exist.remove();
                button.classList.remove("detail-toggle-open");
                return;
            }

            document.querySelectorAll(".hospital-detail-wrapper").forEach(e => e.remove());
            document.querySelectorAll(".detail-toggle-open").forEach(b => b.classList.remove("detail-toggle-open"));

            button.classList.add("detail-toggle-open");

            // loading
            const wrapper = document.createElement("div");
            wrapper.className = "hospital-detail-wrapper";
            wrapper.innerHTML = `<div class="detail-loading">상세 정보를 불러오는 중입니다.</div>`;
            card.insertAdjacentElement("afterend", wrapper);

            fetch(`/general/hospitals/${hpid}/detail`)
                .then(res => {
                    if (!res.ok) throw new Error("상세 정보를 불러오지 못했습니다.");
                    return res.json();
                })
                .then(data => {
                    wrapper.innerHTML = createHospitalDetailHtml(data);
                })
                .catch(err => {
                    wrapper.innerHTML = `<div class="detail-error">${err.message}</div>`;
                });
        });
    });

    function createHospitalDetailHtml(detail) {
        return `
            <div class="hospital-detail-panel">
                <div class="detail-section">
                    <h3 class="detail-title">기본 정보</h3>
                    ${createDetailRow("주소", detail.address)}
                    ${createDetailRow("응급실 번호", detail.emergencyPhone)}
                    ${createDetailRow("대표전화", detail.phone)}
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">응급실 병상</h3>
                    <div class="detail-resource-grid">
                        ${createResourceItem("응급실 병상", detail.emergencyAvailableBeds, detail.emergencyTotalBeds)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">중환자실 자원</h3>
                    <div class="detail-resource-grid">
                        ${createResourceItem("일반 ICU", detail.icuAvailableBeds, detail.icuTotalBeds)}
                        ${createResourceItem("신경과 ICU", detail.neuroIcuAvailableBeds, detail.neuroIcuTotalBeds)}
                        ${createResourceItem("흉부외과 ICU", detail.chestIcuAvailableBeds, detail.chestIcuTotalBeds)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">장비 가능 여부</h3>
                    <div class="detail-capability-list">
                        ${createCapabilityItem("CT", detail.ctAvailable)}
                        ${createCapabilityItem("MRI", detail.mriAvailable)}
                        ${createCapabilityItem("인공호흡기", detail.ventilatorAvailable)}
                        ${createCapabilityItem("CRRT", detail.crrtAvailable)}
                        ${createCapabilityItem("ECMO", detail.ecmoAvailable)}
                        ${createCapabilityItem("혈관조영", detail.angioAvailable)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">중증질환 수용 가능</h3>
                    <div class="detail-capability-list">
                        ${createCapabilityItem("심근경색", detail.myocardialInfarctionAvailable)}
                        ${createCapabilityItem("뇌경색", detail.cerebralInfarctionAvailable)}
                        ${createCapabilityItem("거미막하 출혈", detail.subarachnoidHemorrhageAvailable)}
                        ${createCapabilityItem("기타 출혈", detail.otherHemorrhageAvailable)}
                        ${createCapabilityItem("대동맥 응급 흉부", detail.aorticChestAvailable)}
                        ${createCapabilityItem("대동맥 응급 복부", detail.aorticAbdomenAvailable)}
                        ${createCapabilityItem("응급투석", detail.dialysisAvailable)}
                        ${createCapabilityItem("폐쇄병동 입원", detail.closedWardAvailable)}
                        ${createCapabilityItem("응급내시경 위장관", detail.endoscopyGiAvailable)}
                        ${createCapabilityItem("응급내시경 기관지", detail.endoscopyBronchialAvailable)}
                        ${createCapabilityItem("중증화상", detail.severeBurnsAvailable)}
                        ${createCapabilityItem("성인 혈관중재", detail.angioAdultAvailable)}
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-title">갱신 시간</h3>
                    ${createDetailRow("실시간 정보", formatDateTime(detail.realtimeRecordedAt))}
                </div>
            </div>
        `;
    }

    function createDetailRow(label, value) {
        return `
            <div class="detail-row">
                <span class="detail-label">${escapeHtml(label)}</span>
                <span class="detail-value">${escapeHtml(displayValue(value))}</span>
            </div>
        `;
    }

    function createResourceItem(label, current, total) {
        return `
            <div class="detail-resource">
                <span class="detail-resource-name">${escapeHtml(label)}</span>
                <span class="detail-resource-value">${escapeHtml(formatCount(current, total))}</span>
            </div>
        `;
    }

    function createCapabilityItem(label, value) {
        const status = normalizeAvailability(value);

        return `
            <div class="detail-capability">
                <span>${escapeHtml(label)}</span>
                <span class="capability-badge ${status.className}">${escapeHtml(status.label)}</span>
            </div>
        `;
    }

    function normalizeAvailability(value) {
        const normalized =
            value !== null && value !== undefined
                ? String(value).trim()
                : "";

        if (
            normalized === "Y" ||
            normalized === "가능" ||
            normalized === "1" ||
            normalized === "true"
        ) {
            return {
                label: "가능",
                className: "capability-available"
            };
        }

        if (
            normalized === "N" ||
            normalized === "불가" ||
            normalized === "0" ||
            normalized === "false"
        ) {
            return {
                label: "불가",
                className: "capability-unavailable"
            };
        }

        return {
            label: "정보미제공",
            className: "capability-unknown"
        };
    }

    function formatCount(current, total) {
        const currentValue = displayValue(current);
        const totalValue = displayValue(total);

        if (currentValue === "-" && totalValue === "-") {
            return "-";
        }
        return `${currentValue} / ${totalValue}`;
    }

    function displayValue(value) {
        if (value === null || value === undefined || value === "") {
            return "-";
        }
        return value;
    }

    function formatDateTime(value) {
        if (!value) {
            return "-";
        }
        return String(value).replace("T", " ").slice(0, 16);
    }

    function escapeHtml(value) {
        return String(displayValue(value))
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
