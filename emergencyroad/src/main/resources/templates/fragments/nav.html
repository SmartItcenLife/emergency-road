<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="nav">

  <!-- 로그인 상태 -->
  <div th:if="${session.loginUser != null}"
       style="max-width: 430px; margin: 0 auto; padding: 12px 16px;
              display: flex; align-items: center; justify-content: space-between;
              border-bottom: 1px solid #f0f0f0;">

    <!--프로필 & 닉네임 -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- 프로필 이미지 -->
      <img th:if="${session.loginProfileImage != null}"
         th:src="${session.loginProfileImage}"
         style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
      <!-- 기본 프로필 이미지 (없을 경우) -->
      <img th:if="${session.loginProfileImage == null}"
         src="/images/default-profile.png"
         style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
      <!-- 닉네임 -->
      <span th:text="${session.loginNickname} + '님'"></span>
    <!-- 관리자 뱃지 -->
    <span th:if="${session.loginRole == 'ADMIN'}">[관리자]</span>
    </div>

    <!-- 버튼 -->
    <div style="display: flex; gap: 8px;">
      <a th:href="@{/mypage}"
         style="height: 36px; padding: 0 16px; border-radius: 20px;
            background-color: #0d6efd; color: white;
            font-size: 13px; font-weight: 600;
            display: flex; align-items: center; text-decoration: none;">
        마이페이지
      </a>
      <a th:href="@{/logout}"
         style="height: 36px; padding: 0 16px; border-radius: 20px;
            background-color: white; color: #0d6efd;
            border: 1.5px solid #0d6efd; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; text-decoration: none;">
        로그아웃
      </a>
    </div>
  </div>

  <!-- 비로그인 상태 -->
  <div th:if="${session.loginUser == null}"
       style="max-width: 430px; margin: 0 auto; padding: 12px 16px;
            display: flex; align-items: center; justify-content: flex-end;
            gap: 8px; border-bottom: 1px solid #f0f0f0;">
    <a th:href="${'/login?redirectUrl=' + currentUrl}"
       style="height: 36px; padding: 0 16px; border-radius: 20px;
          background-color: #0d6efd; color: white;
          font-size: 13px; font-weight: 600;
          display: flex; align-items: center; text-decoration: none;">
      로그인
    </a>
    <a th:href="@{/signup}"
       style="height: 36px; padding: 0 16px; border-radius: 20px;
            background-color: white; color: #0d6efd;
            border: 1.5px solid #0d6efd; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; text-decoration: none;">
      회원가입
    </a>
  </div>


</nav>

</body>
</html>
